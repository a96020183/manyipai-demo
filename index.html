<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>慢一拍：班群風暴｜試玩</title>
<style>
:root{
  --bg:#F5F1EA;--ink:#1F1B16;--muted:#7B746A;--line:#E4DDD1;--card:#FFFFFF;
  --red:#E5484D;--red-s:#FDE8E8;--yel:#E9A923;--yel-s:#FDF3DC;--grn:#2E9E68;--grn-s:#E2F4EA;
  --accent:#1F3B5C;--chat:#C7D5E4;--me:#9FDC72;--gray:#8D8780;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.55;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* ---------- app shell ---------- */
#app{height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}
#top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
#top .ttl{font-weight:800;font-size:15px;white-space:nowrap}
#prog{flex:1;display:flex;gap:3px;min-width:0}
#prog i{flex:1;height:6px;border-radius:3px;background:#E2DACD;position:relative}
#prog i.done{background:#B9AE9C}
#prog i.cur{background:var(--accent)}
#prog i.hot::after{content:"";position:absolute;left:50%;top:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red)}
#gridlbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
#speed{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--muted);white-space:nowrap}
#speed.on{background:var(--ink);color:#fff;border-color:var(--ink)}

#main{flex:1;min-height:0;display:flex;flex-direction:column}
#phone{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--chat)}
#phoneHead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#2D3E52;color:#fff;font-size:14px}
#phoneHead b{font-weight:700}
#phoneHead span{opacity:.75;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:10px 12px 14px;scroll-behavior:smooth}
#side{flex:none;display:flex;flex-direction:column;background:var(--bg)}

@media (min-width:880px){
  #main{flex-direction:row;gap:0}
  #phone{flex:0 0 440px;border-right:1px solid var(--line)}
  #side{flex:1;min-width:0;overflow-y:auto}
}

/* ---------- chat ---------- */
.day{text-align:center;margin:6px 0 10px}
.day span{background:rgba(0,0,0,.18);color:#fff;font-size:11.5px;padding:2px 10px;border-radius:10px}
.m{display:flex;gap:8px;margin:7px 0;align-items:flex-start;animation:pop .25s ease-out}
.m .av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.m .bd{max-width:78%}
.m .nm{font-size:11.5px;color:#3D4A58;margin:0 0 2px 2px}
.m .bb{background:#fff;border-radius:4px 14px 14px 14px;padding:7px 11px;font-size:14.5px;box-shadow:0 1px 1px rgba(0,0,0,.05);word-break:break-word}
.m .meta{font-size:10.5px;color:#4E5B69;margin:2px 0 0 4px}
.m.me{flex-direction:row-reverse}
.m.me .bb{background:var(--me);border-radius:14px 4px 14px 14px}
.m.me .meta{text-align:right;margin-right:4px}
.m.tbl .bb{border-left:4px solid #ccc}
.m.tbl.red .bb{border-left-color:var(--red)}
.m.tbl.yel .bb{border-left-color:var(--yel)}
.m.tbl.grn .bb{border-left-color:var(--grn)}
.m.me.red .bb{box-shadow:inset 0 0 0 2px var(--red)}
.m.me.yel .bb{box-shadow:inset 0 0 0 2px var(--yel)}
.m.me.grn .bb{box-shadow:inset 0 0 0 2px var(--grn)}
.sys{text-align:center;margin:8px 0;animation:pop .25s ease-out}
.sys span{display:inline-block;background:rgba(255,255,255,.55);color:#33414F;font-size:12px;padding:3px 11px;border-radius:12px}
.story{background:#FFF8E6;border:1px dashed #D9BE7A;border-radius:12px;padding:9px 12px;font-size:14px;margin:4px 0}
.story .lb{font-size:11px;color:#9A7A2C;display:block;margin-bottom:2px}
.typing{display:inline-flex;gap:3px;padding:10px 12px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA6B2;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* fake screenshot */
.shot{background:#fff;border-radius:6px;padding:14px 10px 12px;position:relative;font-size:13px;margin-top:2px;
  -webkit-mask:linear-gradient(#000,#000);}
.shot::before,.shot::after{content:"";position:absolute;left:0;right:0;height:8px;
  background:linear-gradient(135deg,transparent 4px,#fff 0) 0 0/8px 8px repeat-x,linear-gradient(225deg,transparent 4px,#fff 0) 0 0/8px 8px repeat-x}
.shot::before{top:-6px;transform:scaleY(-1)}
.shot::after{bottom:-6px}
.shot .row{display:flex;gap:6px;align-items:flex-start}
.shot .row .a{width:22px;height:22px;border-radius:50%;background:#C98BB9;flex:none;color:#fff;font-size:10px;display:grid;place-items:center}
.shot .row .t{background:#EEF1F4;border-radius:10px;padding:5px 8px}
.shot .cap{font-size:10.5px;color:#999;margin-top:6px;text-align:right}
.shot.full .row{margin:6px 0}
.shot.full .hl{outline:2px dashed var(--red);outline-offset:3px;border-radius:10px}
.shot.full .ghost{opacity:1}

/* ---------- table ---------- */
#table{padding:10px 14px 6px}
.lbl{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;display:flex;justify-content:space-between}
#seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px 6px;text-align:center;position:relative;transition:.2s}
.seat .ord{position:absolute;top:4px;left:6px;font-size:10.5px;color:var(--muted);font-weight:700}
.seat .fp{position:absolute;top:3px;right:5px;font-size:11px}
.seat .em{font-size:20px;line-height:1.2}
.seat .nm{font-size:12.5px;font-weight:700}
.seat .st{font-size:11px;color:var(--muted);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.seat.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.seat.me{background:#EEF3F9}
.seat .tok{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:2px}
.bub{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);background:var(--ink);color:#fff;font-size:12px;padding:5px 9px;border-radius:10px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;z-index:5;animation:pop .2s}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}

#zone{margin-top:9px;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px}
.zc{background:var(--card);border:1px dashed var(--line);border-radius:12px;min-height:46px;padding:5px 6px;text-align:center}
.zc .zt{font-size:11px;color:var(--muted)}
.zc .tk{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:3px}
.zc.l{border-color:#F2B8BA}.zc.r{border-color:#F2B8BA}
.token{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;animation:drop .35s cubic-bezier(.3,1.6,.6,1)}
.token.red{background:var(--red)}.token.yel{background:var(--yel)}.token.grn{background:var(--grn)}
@keyframes drop{from{transform:translateY(-14px) scale(.6);opacity:0}to{transform:none;opacity:1}}

#rings{margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
#rings .rt{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
#ringbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}
.rg{border-radius:7px;background:#F1ECE3;font-size:11.5px;text-align:center;padding:4px 0;position:relative;transition:.3s}
.rg.gray{background:#B7B0A6;color:#fff}
.rg.pulse{animation:pulse .7s}
.rg .wd{position:absolute;right:4px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
@keyframes pulse{50%{transform:scale(1.08);background:#8D8780}}

/* ---------- sheet ---------- */
#sheet{padding:8px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
@media (min-width:880px){#sheet{border-top:0}}
#status{font-size:13.5px;color:var(--muted);min-height:22px;display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
#status b{color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.act{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 4px 8px;text-align:center;transition:.15s}
.act:active{transform:scale(.97)}
.act:hover{border-color:#BDB3A3}
.act .ic{font-size:21px;line-height:1.2}
.act .k{font-weight:800;font-size:15.5px}
.act .d{font-size:11px;color:var(--muted);line-height:1.3}
.chips{display:flex;flex-direction:column;gap:7px;margin-top:6px;max-height:46vh;overflow-y:auto}
@media (max-width:879px){.chip{padding:5px 10px;font-size:13px}.cg{gap:5px}.cg .h{font-size:11px;margin-top:0}}
.cg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cg .h{font-size:11.5px;font-weight:700;width:100%;margin-top:2px}
.chip{border-radius:20px;padding:7px 12px;font-size:13.5px;border:1.5px solid;background:#fff;text-align:left}
.chip.red{border-color:var(--red);color:#B3262B}.chip.red:hover{background:var(--red-s)}
.chip.yel{border-color:var(--yel);color:#8A6210}.chip.yel:hover{background:var(--yel-s)}
.chip.grn{border-color:var(--grn);color:#1D6E47}.chip.grn:hover{background:var(--grn-s)}
.chip small{opacity:.7;margin-left:4px;font-size:11px}
.row2{display:flex;gap:8px;margin-top:8px}
.btn{border-radius:12px;padding:11px 16px;font-weight:700;background:var(--card);border:1.5px solid var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.full{width:100%}
.btn.ghost{color:var(--muted)}
#timer{height:5px;border-radius:3px;background:#EADFCF;overflow:hidden;margin-top:6px}
#timer i{display:block;height:100%;background:var(--red);transition:width .1s linear}
.tip{font-size:12.5px;background:#FFF6D9;border:1px solid #F0D98C;border-radius:10px;padding:6px 10px;margin-top:6px;color:#6B5310}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;animation:fade .3s}
.ov.dim{background:rgba(20,18,15,.55);display:grid;place-items:center;padding:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pg{max-width:560px;margin:0 auto;padding:28px 20px 40px}
.pg h1{font-size:30px;line-height:1.25;margin:10px 0 6px;letter-spacing:.02em}
.pg h2{font-size:21px;margin:22px 0 8px}
.pg h3{font-size:16px;margin:0 0 6px}
.pg p{margin:8px 0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.kick{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.big{font-size:22px;font-weight:800;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:7px 0;font-size:15px}
.opt.sel{border-color:var(--accent);background:#EEF3F9}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.rules .card{margin:0;padding:12px}
.rules .k{font-weight:800;font-size:17px}
.rules .ic{font-size:22px}
.dots{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}
.dots span{display:flex;align-items:center;gap:6px;font-size:13.5px}
.dots i{width:16px;height:16px;border-radius:50%;display:inline-block}
.modal{background:var(--card);border-radius:18px;max-width:420px;width:100%;padding:18px;animation:pop .25s}
.dm{background:#F3F6FA;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.dm .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.secret{font-size:12px;color:#9A3412;background:#FFF1E7;border-radius:8px;padding:5px 9px;display:inline-block}

/* identity card */
.idc{perspective:900px;margin:18px auto;max-width:340px;height:280px;cursor:pointer}
.pp{display:flex;gap:10px;align-items:flex-start;margin:6px 0;flex-wrap:wrap}
.ppl .pp{flex-wrap:nowrap;margin:10px 0}
.pp .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.tm{background:#F1ECE3;border-radius:20px;padding:4px 10px;font-size:13.5px}
@media (min-width:880px){.toast{top:auto;bottom:28px}}
@media (max-width:879px){body.picking #table{display:none}body.picking .chips{max-height:none}}
.idc .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.idc.flip .in{transform:rotateY(180deg)}
.idc .f,.idc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:20px}
.idc .f{background:repeating-linear-gradient(45deg,#2D3E52,#2D3E52 10px,#33465C 10px,#33465C 20px);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px}
.idc .b{background:#FFFDF8;border:2px solid var(--ink);transform:rotateY(180deg)}
.idc .b .t{font-size:22px;font-weight:800;margin:4px 0 10px}
.idc .b .r{font-size:13.5px;margin:6px 0}
.idc .b .r b{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em}

/* reveal */
.full-conv{background:#fff;border-radius:12px;padding:12px;margin:10px 0}
.full-conv .ln{display:flex;gap:8px;margin:7px 0;font-size:14px}
.full-conv .ln .w{flex:none;font-weight:700;width:36px;color:var(--muted);font-size:12.5px;padding-top:2px}
.full-conv .ln.ctx{max-height:0;opacity:0;overflow:hidden;margin:0;transition:max-height .9s ease,opacity .9s ease,margin .9s}
.full-conv.open .ln.ctx{max-height:120px;opacity:1;margin:7px 0}
.full-conv .ln.cut{transition:transform .5s}
.full-conv:not(.open) .ln.cut{transform:scale(1.04)}
.full-conv .ln.cut .x{background:var(--red-s);outline:2px dashed var(--red);outline-offset:2px;border-radius:6px;padding:0 4px}
.who-says{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:10px 0;font-size:14.5px}
.who-says b{display:block;font-size:12.5px;color:var(--muted)}

/* ending */
.end-hero{background:#1F1B16;color:#F5F1EA;border-radius:18px;padding:22px 20px;margin:12px 0}
.end-hero .kick{color:#B9AE9C}
.end-hero p{font-size:16.5px;line-height:1.75}
.tail{border-top:1px solid #3B342C;margin-top:14px;padding-top:12px;color:#D9D0C2;font-size:15px!important}
.stat{display:flex;gap:12px;align-items:center}
.stat .n{font-size:34px;font-weight:800;line-height:1;min-width:70px}
.bar2{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bar2 .tr{height:12px;background:#EFE9DF;border-radius:6px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:var(--red);border-radius:6px}
.bar2.y .tr i{background:var(--accent)}
.mini{font-size:12.5px;color:var(--muted)}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idgrid .card{margin:0;padding:12px;font-size:13px}
.idgrid .card .t{font-weight:800;font-size:14px}
.ok{color:var(--grn);font-weight:800}.no{color:var(--red);font-weight:800}
.q{counter-increment:q;margin:12px 0;padding-left:30px;position:relative}
.q::before{content:counter(q);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.qs{counter-reset:q}
.rp-phone{background:#2D3E52;border-radius:26px;padding:10px;max-width:400px;margin:12px auto}
.rp-head{color:#fff;font-size:13px;display:flex;justify-content:space-between;padding:4px 8px 8px}
.rp-chat{background:var(--chat);border-radius:16px;height:58vh;overflow-y:auto;padding:10px;scroll-behavior:smooth}
.rp-chat .m .bb{font-size:13.5px}
.rp-chat .mine .bb{box-shadow:0 0 0 2.5px #1F1B16}
.rp-chat .tagme{font-size:10.5px;background:#1F1B16;color:#fff;border-radius:8px;padding:0 6px;margin-left:4px}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;z-index:60;animation:pop .25s;max-width:90vw;text-align:center}
.gridcard{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(245,241,234,.86);animation:fade .2s}
.gridcard .in{text-align:center}
.gridcard .n{font-size:13px;letter-spacing:.2em;color:var(--muted);font-weight:700}
.gridcard .t{font-size:28px;font-weight:800;margin-top:4px}
.gridcard .hotb{display:inline-block;margin-top:8px;background:var(--red);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:12px;font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:700}
/* cover */
.cover{background:radial-gradient(120% 80% at 80% 0%,#2C3F57 0%,#17202B 60%) fixed;color:#F3EEE6}
.cover .kick{color:#9FB0C4}
.cv-title{font-size:44px!important;line-height:1.05!important;margin:14px 0 18px!important;letter-spacing:.04em}
.cv-title span{display:block;font-size:24px;letter-spacing:.3em;color:#C9D4E0;margin-top:8px;font-weight:700}
.cv-stage{position:relative;height:196px;margin:6px 0 14px}
.cv-notif{position:absolute;left:0;right:22px;top:0;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:14px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.cv-notif .ic{width:30px;height:30px;border-radius:8px;background:#06C755;display:grid;place-items:center;font-weight:800;color:#fff;font-size:10px;flex:none}
.cv-notif b{display:block;font-size:13px}.cv-notif span{opacity:.75}
.cv-card{position:absolute;left:18px;right:0;top:62px;background:#fff;color:#1F1B16;border-radius:10px;padding:16px 14px 14px;transform:rotate(-2.2deg);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cv-card::before,.cv-card::after{content:"";position:absolute;left:0;right:0;height:9px;background:linear-gradient(135deg,transparent 5px,#fff 0) 0 0/10px 10px repeat-x,linear-gradient(225deg,transparent 5px,#fff 0) 0 0/10px 10px repeat-x}
.cv-card::before{top:-8px;transform:scaleY(-1)}.cv-card::after{bottom:-8px}
.cv-card .row{display:flex;gap:8px}.cv-card .a{width:26px;height:26px;border-radius:50%;background:#B55A5A;color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
.cv-card .t{background:#EEF1F4;border-radius:10px;padding:7px 10px;font-size:14px;line-height:1.5}
.cv-q{position:absolute;right:6px;bottom:-6px;background:var(--red);color:#fff;font-weight:800;padding:7px 13px;border-radius:16px 16px 4px 16px;font-size:14px;box-shadow:0 8px 20px rgba(229,72,77,.4);transform:rotate(2deg)}
.cv-line{font-size:22px;font-weight:800;line-height:1.45;margin:22px 0 14px}
.cv-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.cv-meta span{background:rgba(255,255,255,.1);border-radius:20px;padding:5px 11px;font-size:13px}
.cover .btn.pri{background:#F3EEE6;color:#17202B;border-color:#F3EEE6;font-size:17px;padding:15px}
.cover details{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#DDE4EC}
.cover .mini{color:#A9B6C4}

const Q = new URLSearchParams(location.search);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function snd(kind){

             whoosh:[180,1100,.55,.04],bad:[330,140,.32,.06],good:[620,940,.2,.05],vote:[480,640,.08,.04]}[kind]||[600,600,.05,.03];
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type = kind==='tick'?'square':'sine'; o.connect(g); g.connect(AC.destination);
    o.frequency.setValueAtTime(P[0],t); o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
    g.gain.setValueAtTime(P[3],t); g.gain.exponentialRampToValueAtTime(.0001,t+P[2]+.06);

}

const PUBLIC_RED = e => e.col==='red' && (e.a==='say'||e.a==='vote'||e.a==='leak');

}
function aheadInfo(){
  const t=S.turn.tokens; const red晴=t.filter(x=>x.col==='red'&&x.tg==='晴').length, red希=t.filter(x=>x.col==='red'&&x.tg==='希').length;
  const yel=t.filter(x=>x.col==='yel').length, grn=t.filter(x=>x.col==='grn').length;
  const maj = red晴>red希?'晴':red希>red晴?'希':null;
  return {red晴,red希,yel,grn,red:red晴+red希,maj,majN:Math.max(red晴,red希),spr:S.turn.spr};
}
const pressOf = p => S.log.filter(e=>e.who===p.id&&e.aheadMajN>=2&&(e.a==='say'||e.a==='vote'||e.a==='chk'||e.a==='spr'||e.a==='wait')).length;

/* ---------------- NPC 決策 ---------------- */
function npcWeights(p,g,ah){
  const P=PERS[p.ident.k], n=g.n;
  const eff={晴:p.susp.晴+P.conf*.55*ah.red晴, 希:p.susp.希+P.conf*.55*ah.red希};
  let tg = eff.晴>=eff.希?'晴':'希'; const m=eff[tg];
  const w={
    red: Math.max(0,m-.5)*1.5*P.red,
    yel: .55*P.yel*(p.ident.k==='new'&&ah.yel>ah.red?2:1),
    grn: P.grn*(ah.red>0?.9:.25)*(p.ident.k==='friend'&&ah.red晴>0?2:1)*(p.ident.k==='lead'&&(S.grayPts>0||ah.spr>0)?2:1),
    chk: .45*P.chk*(p.notes.length>2?.4:1),
    spr: .32*P.spr*(ah.red+(ah.spr?0:1)>0?1:.5)*(p.ident.k==='news'&&S.turn.order[0]===p?1.6:1),
    wait:.35*P.wait,
  };
  if(p.ident.k==='new') w.red*=(1+ah.majN*.9);
  if(p.ident.k==='old'&&tg==='晴') w.red*=.8;
  w.red*=Math.pow(.55,ah.grn)*Math.pow(.75,ah.yel);
  if(ah.grn||ah.yel) w.yel*=1.25;
  w.red*=({1:1.1,2:1.05,4:1.25,5:1.4,7:1.35,8:1.05,9:1.25,10:1.5,11:1.3,12:1.2,14:.6,16:.55})[n]||1;
  w.red*=.8+S.heat/100*.5;                      // 班群越熱，越容易跟著攻擊
  w.spr*=.55;
  if(g.hot){ w.red*=1.3; w.chk*=.45; w.spr*=1.2; }
  if(n>=14){ w.red*=.75; w.yel*=1.3; }
  // 導演：確保每位真人玩家在前段至少經歷 3 次「前面已有兩顆同方向紅色」
  const ord=S.turn.order, pi=ord.indexOf(p);
  const tgtHuman=ord.find((x,i)=>i>pi && i>=2 && x.isHuman && pressOf(x)<3);
  const forced = n<=12 && !!tgtHuman && rng()<.85;
  return {w,tg:forced?(ah.maj||tg):tg,forced};
}
function npcDecide(p,g){
  const ah=aheadInfo(), n=g.n;
  if(n===18) return npc18(p,ah);
  if(g.ty==='v') return npcVote(p,g,ah);
  const {w,tg,forced}=npcWeights(p,g,ah);
  const unshared=p.notes.filter(x=>!x.shared);
  if(unshared.length) w.share=.35*PERS[p.ident.k].chk;
  const k=forced?'red':wpick(w);
  if(k==='red'){ const ch=pick(chipsFor(n).red.filter(c=>c.tg===tg)); return {a:'say',col:'red',tg,t:ch.t,lead:p.ident.k==='new'&&ah.majN>0?'我也覺得，':''}; }
  if(k==='yel') return {a:'say',col:'yel',t:pick(chipsFor(n).yel)};
  if(k==='grn') return {a:'say',col:'grn',t:pick(chipsFor(n).grn),lead:p.ident.k==='lead'?'好了啦，':''};
  if(k==='share'){ const no=unshared[0]; no.shared=true; return {a:'say',col:'yel',t:'我剛問到：'+no.s,share:true}; }
  if(k==='spr'){ const os=fwOptions(g); const r=rng(); const o=(r<.25&&os.find(x=>x.k==='red'))||(r<.4&&os.find(x=>x.k==='say'))||os[0]; return {a:'spr',fw:o.k,t:o.t,src:o.src}; }
  return {a:k};
}
function npcVote(p,g,ah){
  const {w,tg,forced}=npcWeights(p,g,ah);
  const k=forced?'red':wpick({red:w.red*1.3,yel:w.yel+w.chk*.5+w.wait*.5,grn:w.grn});
  if(k==='red') return voteAct(VOTE_OPTS.find(o=>o.k===tg));
  return voteAct(VOTE_OPTS.find(o=>o.k===k));
}
const voteAct = o => ({a:'vote',col:o.col,tg:o.tg,t:'投票：'+o.t,vk:o.k});
function npc18(p,ah){
  const k=p.ident.k, r=rng();
  if(k==='friend') return r<.6?{a:'spr'}:{a:'say',col:'grn',t:'大家去看完整對話，舊圖不要再傳了'};
  if(k==='lead') return r<.7?{a:'spr'}:{a:'say',col:'grn',t:'大家去看完整對話，舊圖不要再傳了'};
  if(k==='news') return r<.4?{a:'spr',fw:'full',t:'完整對話'}:r<.55?{a:'spr',fw:'old',t:'原本那張截圖'}:r<.8?{a:'say',col:'yel',t:'原來我之前想錯了'}:{a:'wait'};
  if(k==='new') return ah.spr?{a:'spr'}:r<.5?{a:'wait'}:{a:'say',col:'yel',t:'我還在消化'};
  if(k==='seat') return r<.45?{a:'say',col:'yel',t:'原來我之前想錯了'}:r<.75?{a:'wait'}:{a:'say',col:'grn',t:'對不起，我之前說太快了'};
  if(k==='old') return r<.4?{a:'say',col:'red',tg:'晴',t:'反正子晴平常就很討厭'}:{a:'wait'};
  return {a:'wait'};
}
function wpick(w){ const ks=Object.keys(w); const s=ks.reduce((a,k)=>a+w[k],0); let x=rng()*s; for(const k of ks){ if((x-=w[k])<=0) return k; } return ks[ks.length-1]; }

/* ---------------- 套用行動 ---------------- */
async function apply(p,act,g,ms){
  const ah=aheadInfo(), pos=S.turn.order.indexOf(p)+1;
  S.log.push({g:g.n,hot:!!g.hot,pos,who:p.id,human:!!p.isHuman,ident:p.ident.k,a:act.a,col:act.col||'',tg:act.tg||'',t:act.t||'',
    aheadRed:ah.red,aheadMaj:ah.maj||'',aheadMajN:ah.majN,aheadYel:ah.yel,aheadGrn:ah.grn,ms:ms||'',share:!!act.share,timeout:!!act.timeout});
  S.turn.acts[p.id]=act;
  const seat=$('#seat-'+p.id); if(seat) seat.classList.add('now');
  if(act.a==='say'||act.a==='vote'){
    S.turn.tokens.push({col:act.col,tg:act.tg,by:p.id}); addToken(p,act); snd(act.a==='vote'?'vote':'drop');
    if(S.physical&&p.isHuman&&!S.show) toast(`${act.col==='red'?'🔴':act.col==='yel'?'🟡':'🟢'} ${p.name}：把${CLN[act.col]}代幣放到${act.col==='red'?'「'+TG[act.tg]+'」那一側':'中間'}`,2200);
    if(!p.isMe) bubble(p,(act.lead||'')+act.t);
    if(act.a==='say') await post({player:p.id,t:(act.lead||'')+act.t,col:act.col,read:Math.floor(14+rng()*12)},{typing:false});
    else updatePoll(act.vk);
    if(act.col==='red') await heat(5+(ah.maj===act.tg?2:0));
    else if(act.col==='grn') await heat(-8,p);
    else await heat(act.share?-6:-3,p);
    if(act.share){ S.players.forEach(q=>{ if(!q.isHuman){ const k=q.susp.晴>q.susp.希?'晴':'希'; q.susp[k]=Math.max(0,q.susp[k]-.35);} }); }
  } else if(act.a==='spr'){
    S.turn.spr++;
    if(!act.fw){ act.fw=g.n===18?'full':'shot'; act.t=g.n===18?'完整對話':'原始截圖'; S.log[S.log.length-1].t=act.t; }
    if(act.src) act.src.fwd=g.n;
    if(g.n<=16){ const before=grayStage(); S.grayPts++; renderRings(true); const after=grayStage();
      if(!p.isMe) bubble(p,act.fw==='red'?`我把「${clip(act.t)}」轉出去`:act.fw==='say'?'我把這段轉給別班':'我把截圖轉給別班');
      snd('whoosh'); toast(after>before?`📤 截圖傳到了「${RING[after]}」`:`📤 ${p.isMe?'你':p.name}把截圖轉傳出去`);
      await heat(5);
    } else if(act.fw==='old'){ S.grayPts++; S.oldAfter=true; renderRings(true); if(!p.isMe) bubble(p,'我把那張截圖轉出去');
      snd('bad'); toast('🖼️ 真相出來之後，舊截圖又被傳出去了'); await heat(6);
    } else { S.whitePasses++; if(!p.isMe) bubble(p,'把完整對話轉出去'); snd('good');
      if(S.white<grayStage()){ S.white++; renderRings(); toast(`📨 完整對話傳到了「${RING[S.white]}」`); }
      else toast('📨 收過截圖的地方，都已經有人收到完整對話了');
      await heat(-6,p); }
  } else if(act.a==='chk'){
    if(!p.isHuman){ bubble(p,'（低頭看私訊）'); if(g.chk&&g.chk.s) p.notes.push({g:g.n,s:g.chk.s,shared:false}); }
  } else if(act.a==='wait'){ if(!p.isMe) bubble(p,'（已讀）'); }
  renderSeats(S.turn.order);
  await sleep(p.isHuman?280:650);
}

function checkFor(g,p){

function autoAct(g,ah,p){

    if(AUTO==='yellow') return voteAct(VOTE_OPTS[2]); if(AUTO==='green') return voteAct(VOTE_OPTS[3]);
    if(AUTO==='follow'&&ah.maj) return voteAct(VOTE_OPTS.find(o=>o.k===ah.maj));
    return voteAct(pick(VOTE_OPTS));
  }
  const note = ()=>{ const c=checkFor(g,p); if(c&&c.s) p.notes.push({g:g.n,s:c.s,shared:false}); return {a:'chk'}; };
  if(AUTO==='yellow') return {a:'say',col:'yel',t:C.yel[0]};
  if(AUTO==='green') return {a:'say',col:'grn',t:C.grn[0]};
  if(AUTO==='follow'){ if(ah.maj) return {a:'say',col:'red',tg:ah.maj,t:C.red.find(c=>c.tg===ah.maj).t}; return r<.5?{a:'say',col:'yel',t:'先等完整的對話'}:note(); }
  if(AUTO==='spread') return {a:'spr'};
  if(AUTO==='checker') return note();
  if(r<.3){ const c=pick(C.red); return {a:'say',col:'red',tg:c.tg,t:c.t}; }
  if(r<.45) return {a:'say',col:'yel',t:pick(C.yel)};
  if(r<.55) return {a:'say',col:'grn',t:pick(C.grn)};

}

function computeEnding(){
  const t=tally(1,16), st=grayStage();
  const H=humans(), nh=H.length||1;
  const hl=S.log.filter(e=>e.human&&e.g<=16&&(e.a==='say'||e.a==='vote'));
  const T = 12 + (.2*hl.filter(e=>e.col==='grn').length + .15*hl.filter(e=>e.col==='yel').length)/nh - 2.5*st;
  const W={晴:0,希:0}; S.log.forEach(e=>{ if(PUBLIC_RED(e)&&e.g<=16) W[e.tg]+=e.g>=8?1.6:1; });
  let who='none';
  if(W.晴>=T-2&&W.希>=T-2&&Math.min(W.晴,W.希)/Math.max(W.晴,W.希)>=.85) who='both';
  else if(W.晴>=T||W.希>=T) who=W.晴>=W.希?'晴':'希';
  const R=who==='晴'?W.晴:who==='希'?W.希:who==='both'?Math.max(W.晴,W.希):0;
  const score=R+st*3; const lv=score>=22?2:score>=15.5?1:0;
  const e18=S.log.filter(e=>e.g===18);
  return {t,st,who,lv,red18:e18.filter(e=>e.col==='red'),W};
}

function reviewNodes(){
  const L=S.log.filter(e=>e.g<=16&&(e.a==='say'||e.a==='vote')).sort((a,b)=>a.g-b.g||a.pos-b.pos);
  const nodes=[];
  const fr=L.find(e=>e.col==='red'); if(fr) nodes.push(`第 ${fr.g} 格，你們桌第一次出現明確指向${TG[fr.tg]}的公開表態（${nameOf(fr.who)}）。`);
  const prs=L.find(e=>e.human&&e.aheadMajN>=2&&e.pos>=3);
  if(prs) nodes.push(`第 ${prs.g} 格，${nameOf(prs.who)}排在第 ${prs.pos} 位，前面已經有 ${prs.aheadMajN} 顆指向${TG[prs.aheadMaj]}的紅色。${nameOf(prs.who)}${prs.col==='red'&&prs.tg===prs.aheadMaj?'也放了同方向的紅色':prs.col==='red'?'放了另一個方向的紅色':`放了${CLN[prs.col]}`}。`);
  let lead=null; for(let g=1;g<=16;g++){ const r=L.filter(e=>e.g===g&&e.col==='red'); const a=r.filter(e=>e.tg==='晴').length, b=r.filter(e=>e.tg==='希').length;
    const now=a>b?'晴':b>a?'希':null; if(now&&lead&&now!==lead){ nodes.push(`第 ${g} 格開始，你們的懷疑對象從${TG[lead]}轉向${TG[now]}。`); break; } if(now) lead=now; }
  const lk=S.log.find(e=>e.a==='leak'); if(lk) nodes.push(`第 11 格，${nameOf(lk.who)}在私訊裡說的「${lk.t}」被截圖貼進了班群。`);
  const c=biggestCascade(); if(c&&nodes.length<4) nodes.push(`第 ${c.g} 格，${c.first}放下指向${TG[c.tg]}的紅色之後，${c.names.join('、')}依序跟上。`);
  return nodes.slice(0,3);
}

function statsFor(p){
  const id=p.id, isA=e=>e.a==='say'||e.a==='vote'||e.a==='chk'||e.a==='spr'||e.a==='wait';
  const L=S.log.filter(e=>e.who===id&&e.g<=16&&isA(e));
  const press=L.filter(e=>e.aheadMajN>=2), followed=press.filter(e=>e.col==='red'&&e.tg===e.aheadMaj);
  const press1=L.filter(e=>e.aheadMajN>=1), followed1=press1.filter(e=>e.col==='red'&&e.tg===e.aheadMaj);
  const clean=L.filter(e=>e.aheadRed===0), cleanRed=clean.filter(e=>e.col==='red');
  const myReds=L.filter(e=>e.col==='red');
  let followers=0, held=0; const chain=[];
  myReds.forEach(r=>{ const f=S.log.filter(e=>e.g===r.g&&e.pos>r.pos&&e.col==='red'&&e.tg===r.tg&&isA(e)); followers+=f.length;
    if(f.length) chain.push({g:r.g,tg:r.tg,names:f.map(e=>nameOf(e.who))}); });
  L.filter(e=>e.col==='grn'||e.col==='yel'||e.share).forEach(r=>{ held+=S.log.filter(e=>e.g===r.g&&e.pos>r.pos&&isA(e)&&e.col!=='red').length; });
  const myFirstRed=myReds[0];
  const chkBeforeRed=myFirstRed?S.log.some(e=>e.who===id&&e.a==='chk'&&e.g<=myFirstRed.g):null;
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length/100)/10:null;
  const dm=S.log.find(e=>e.who===id&&e.a==='dm'), leak=S.log.find(e=>e.who===id&&e.a==='leak');
  return {press:press.length,followed:followed.length,clean:clean.length,cleanRed:cleanRed.length,myReds:myReds.length,followers,held,chain,myFirstRed,chkBeforeRed,
    hotS:avg(S.log.filter(e=>e.who===id&&e.hot&&e.ms).map(e=>e.ms)),normS:avg(S.log.filter(e=>e.who===id&&!e.hot&&e.ms&&e.g!==18).map(e=>e.ms)),
    goal:goalCheck(p),spr:L.filter(e=>e.a==='spr').length,chk:L.filter(e=>e.a==='chk').length,waits:L.filter(e=>e.a==='wait').length,
    grnVsRed:L.filter(e=>e.col==='grn'&&e.aheadRed>0).length,says:S.log.filter(e=>e.who===id&&e.a==='say').length,
    noteN:p.notes.length,sharedN:p.notes.filter(n=>n.shared).length,red晴:myReds.filter(e=>e.tg==='晴').length,red希:myReds.filter(e=>e.tg==='希').length,
    vote:S.log.find(e=>e.who===id&&e.a==='vote'),dm,leak,timeouts:L.filter(e=>e.timeout).length,
    press1:press1.length,followed1:followed1.length,cool:S.cool[id]||0,grn:L.filter(e=>e.col==='grn').length};
}
function goalCheck(p){
  const L=S.log.filter(e=>e.who===p.id&&e.a!=='dm'&&e.a!=='leak');
  switch(p.ident.k){
    case 'friend': return L.some(e=>e.col==='grn'&&S.log.some(x=>x.g===e.g&&x.col==='red'&&x.tg==='晴'&&x.a!=='leak'));
    case 'seat': return L.some(e=>e.g<8&&e.col==='red'&&e.tg==='晴');
    case 'news': return L.filter(e=>(e.a==='say'||e.a==='spr')&&!S.log.some(x=>x.g===e.g&&x.pos<e.pos&&(x.a==='say'||x.a==='spr'))).length>=2;

function biggestCascade(){
  let best=null;
  for(let g=1;g<=16;g++){ const L=S.log.filter(e=>e.g===g&&(e.a==='say'||e.a==='vote')).sort((a,b)=>a.pos-b.pos);
    const firstRed=L.find(e=>e.col==='red'); if(!firstRed) continue;
    const f=L.filter(e=>e.pos>firstRed.pos&&e.col==='red'&&e.tg===firstRed.tg);
    const humanInvolved=firstRed.human||f.some(e=>e.human);
    if(humanInvolved&&f.length&&(!best||f.length>best.names.length)) best={g,tg:firstRed.tg,first:nameOf(firstRed.who),names:f.map(e=>nameOf(e.who))}; }
  return best;
}

function keyTurn(p){
  const L=S.log.filter(e=>e.who===p.id&&e.g<=16&&e.a!=='dm'&&e.a!=='leak');
  return L.find(e=>e.aheadMajN>=2&&e.col==='red')||L.find(e=>e.aheadMajN>=2)||L.find(e=>e.col==='red')||L[0];

function localTime(){ const d=new Date(),z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function humanSummary(h){

全桌紅色：指向子晴 ${o.tableRed.red晴}、指向妍希 ${o.tableRed.red希}｜總時間約 ${o.minutes} 分鐘

function loadSessions(){ try{ return JSON.parse(localStorage.getItem('manyipai_sessions')||'[]').filter(x=>x.humans); }catch(e){ return []; } }
const csvRow = a => a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',');
function toCSV(sessions){
  const H=['場次','時間','模式','格','熱格','順位','行動者','真人','行動者身分','行動','顏色','指向','留言','前方紅色數','前方多數指向','前方多數數量','前方黃','前方綠','分享查到的','逾時','決定毫秒','結局','程度'];
  const AC={say:'說',chk:'查',spr:'傳',wait:'等',vote:'投票',dm:'私訊回覆',leak:'私訊被截圖'}, CL={red:'紅',yel:'黃',grn:'綠'};
  const rows=[H.join(',')];
  sessions.forEach(s=>s.log.forEach(e=>{ const p=s.players.find(x=>x.id===e.who)||{};
    rows.push(csvRow([s.id,s.at,s.mode==='solo'?'單人':'多人同機',e.g,e.hot?1:0,e.pos,p.name||e.who,e.human?1:0,p.ident||e.ident,AC[e.a]||e.a,CL[e.col]||'',TG[e.tg]||'',e.t,e.aheadRed,TG[e.aheadMaj]||'',e.aheadMajN,e.aheadYel,e.aheadGrn,e.share?1:0,e.timeout?1:0,e.ms,s.summary.ending,s.summary.level])); }));
  return '﻿'+rows.join('\n');
}
function toSumCSV(sessions){
  const H=['場次','時間','模式','玩家','身分卡','賽前_判斷速度','賽前_從眾','賽後_判斷速度','賽後_從眾','第一次放紅色(格)','壓力下跟隨','無壓力時放紅','之後跟上人數','私訊回覆','私訊被截圖','投票','私人目標','熱格平均秒','一般格平均秒','逾時次數','結局','程度','截圖最遠','完整資訊到','溫度最高','總分鐘','訪談題目與回答'];
  const rows=[H.join(',')];
  sessions.forEach(s=>{ const o=s.summary; const qa=(s.ivq||[]).map(q=>`【${q.q}】${(s.answers||{})[q.id]||''}`).join('\n');
    o.humans.forEach(h=>rows.push(csvRow([s.id,s.at,o.mode,h.name,h.ident,h.pre.q1,h.pre.q2,h.post.q1,h.post.q2,h.myFirstRed??'',h.follow,h.cleanRed,h.followers,h.dm,h.leaked?1:0,h.vote,h.goal?'達成':'未達成',h.hotS??'',h.normS??'',h.timeouts,o.ending,o.level,o.gray,o.white,o.heatPeak,o.minutes,qa]))); });
  return '﻿'+rows.join('\n');
}
function download(name,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

function setupPlayers(names){
  const hs = names.map((nm,i)=>({id:solo()?'me':'H'+(i+1),name:nm,em:HUM_LOOK[i].em,c:HUM_LOOK[i].c,isHuman:true,isMe:solo()}));
  const total=Math.max(4,hs.length);
  const npcs=NPC_POOL.slice(0,total-hs.length).map(x=>({...x,isHuman:false,isMe:false}));
  // 真人與電腦交錯入座
  const seats=[]; const hq=[...hs], nq=[...npcs];
  while(hq.length||nq.length){ if(hq.length) seats.push(hq.shift()); if(nq.length) seats.push(nq.shift()); }
  const ids=[...IDS].sort(()=>rng()-.5);
  S.players=seats.map((p,i)=>({...p,ident:ids[i],susp:{晴:0,希:0},notes:[],pre:{},post:{},
    tok:p.isMe?'你':p.isHuman?p.name.slice(0,1):p.name.slice(1,2)}));
  S.first=Math.floor(rng()*S.players.length);
  $('#tbllbl').textContent=`同桌的 ${S.players.length} 個人（本格行動順序）`;
  renderSeats(); renderRings(); renderHeat();
}

function layout(){
  // 電腦：照實體擺法——棋盤一圈、中間是平板（班群）；代幣、溫度、擴散環放旁邊。手機：維持直式版面
  const desk=innerWidth>=880, main=$('#main'), board=$('#board'), bc=$('#bcenter'), phone=$('#phone'), table=$('#table'), seats=$('#seats');
  const parts=['#zone','#heat','#rings'].map(x=>$(x));
  if(desk){
    if(board.parentElement!==main) main.insertBefore(board,main.firstChild);
    if(phone.parentElement!==bc) bc.appendChild(phone);
    let at=seats; parts.forEach(el=>{ at.after(el); at=el; });
    document.body.classList.add('deskboard');
  } else {
    if(board.parentElement!==table) seats.after(board);
    if(phone.parentElement!==main) main.insertBefore(phone,main.firstChild);
    parts.forEach(el=>bc.appendChild(el));
    document.body.classList.remove('deskboard');
  }
  scrollChat();
}
function fitZoom(){
  // 大螢幕等比放大：以 1280×800 為基準，手機與小螢幕維持 1
  const w=innerWidth, h=innerHeight;
  const z = w<880 ? 1 : Math.max(1, Math.min(w/1280, h/800, 2.2));
  document.documentElement.style.setProperty('--z', z.toFixed(3));
}
fitZoom(); addEventListener('resize', ()=>{ fitZoom(); layout(); });
function setup(){

      await holdCard(h,`<h3 style="font-size:20px;margin:8px 0 10px">${h.ident.t}</h3><p><b class="mini">你知道的事</b><br>${h.ident.know}</p>

        <p style="margin-bottom:2px"><b class="mini">你私下查到的</b></p>${notes}`,'回到班群'); };
    if(solo()) return show(S.players[0]);
    showModal(`<div class="kick">誰要看自己的身分卡？</div>${humans().map(h=>`<button class="vbtn yel" data-id="${h.id}" style="border-color:var(--line);color:var(--ink)">${h.em} ${esc(h.name)}</button>`).join('')}<button class="btn ghost full" id="cx">取消</button>`,false,'modal2');

  };
